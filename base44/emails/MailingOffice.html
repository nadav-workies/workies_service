<mjml>
  <mj-head>
    <mj-title>{{headline}}</mj-title>
    <mj-preview>{{subheadline}}</mj-preview>
    <mj-font name="Rubik" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&amp;display=swap" />
    <mj-attributes>
      <mj-all font-family="Rubik, Arial, sans-serif" />
      <mj-section background-color="#ffffff" padding="0 36px" />
      <mj-column padding="0" />
      <mj-text color="#111111" font-size="16px" line-height="1.7" padding="0" align="right" css-class="rtl" />
      <mj-button background-color="#16a5b4" color="#ffffff" border-radius="12px" font-size="16px" font-weight="800" inner-padding="15px 32px" padding="0" align="right" />
      <mj-image padding="0" />
      <mj-class name="muted" color="#5b5f66" />
    </mj-attributes>
    <mj-style>.rtl div { direction: rtl; }</mj-style>
  </mj-head>
  <mj-body background-color="#f4f4f4" width="600px">
    <mj-section padding="22px 36px">
      <mj-column>
        <mj-image src="https://media.base44.com/images/public/6a1d5a36316988d9f113f88e/1c0d76342_1.png" alt="Workies" width="44px" align="right" padding="0 0 8px" />
        <mj-text font-size="13px" font-weight="700" letter-spacing="2px" color="#16a5b4">WORKIES · משרדים וחללי עבודה</mj-text>
      </mj-column>
    </mj-section>
    <mj-hero mode="fixed-height" height="240px" background-width="600px" background-height="240px" background-color="#111111" background-position="center center" padding="0"
      background-url="https://base44.app/api/apps/6a1d5a36316988d9f113f88e/files/mp/public/6a1d5a36316988d9f113f88e/05f35138d_office_2880x4074.jpg">
      <mj-spacer height="1px" />
    </mj-hero>
    <mj-section padding="38px 36px 8px">
      <mj-column>
        <mj-text font-size="30px" font-weight="800" line-height="1.2">{{headline}}</mj-text>
        <mj-text mj-class="muted" font-size="17px" padding="10px 0 0">{{subheadline}}</mj-text>
      </mj-column>
    </mj-section>
    <mj-section padding="20px 36px 40px">
      <mj-column>
        <mj-text font-weight="700" padding="0 0 6px">שלום {{first_name}},</mj-text>
        <mj-text padding="0 0 24px">{{body}}</mj-text>
        <mj-button href="{{cta_url}}">{{cta_label}}</mj-button>
      </mj-column>
    </mj-section>
    <mj-section background-color="#111111" padding="30px 36px">
      <mj-column>
        <mj-text color="#ffffff" font-size="18px" font-weight="800">Workies באר שבע</mj-text>
        <mj-text color="#c9cbce" font-size="14px" padding="6px 0 0">אליהו נאווי 24, באר שבע</mj-text>
      </mj-column>
    </mj-section>
    <mj-section background-color="#f4f4f4" padding="20px 36px 28px">
      <mj-column>
        <mj-text align="center" font-size="12px" color="#5b5f66">דיוור פרסומי מאת Workies. <a href="{{unsubscribe_url}}" style="color:#5b5f66;text-decoration:underline;">להסרה מרשימת התפוצה</a></mj-text>
      </mj-column>
    </mj-section>
  </mj-body>
</mjml>
