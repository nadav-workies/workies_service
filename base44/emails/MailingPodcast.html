<mjml>
  <mj-head>
    <mj-title>{{headline}}</mj-title>
    <mj-preview>{{subheadline}}</mj-preview>
    <mj-font name="Rubik" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&amp;display=swap" />
    <mj-attributes>
      <mj-all font-family="Rubik, Arial, sans-serif" />
      <mj-section background-color="#141819" padding="0 36px" />
      <mj-column padding="0" />
      <mj-text color="#F6EFE5" font-size="16px" line-height="1.7" padding="0" align="right" css-class="rtl" />
      <mj-button background-color="#D59C70" color="#141819" border-radius="6px" font-size="16px" font-weight="800" inner-padding="15px 32px" padding="0" align="right" />
      <mj-image padding="0" />
      <mj-divider border-color="#D59C70" border-width="2px" padding="0" />
    </mj-attributes>
    <mj-style>.rtl div { direction: rtl; }</mj-style>
  </mj-head>
  <mj-body background-color="#0e1112" width="600px">
    <mj-section padding="28px 36px 0">
      <mj-column>
        <mj-image src="https://media.base44.com/images/public/6a1d5a36316988d9f113f88e/1c0d76342_1.png" alt="Workies" width="44px" align="right" padding="0 0 8px" />
        <mj-text color="#D59C70" font-size="13px" font-weight="700" letter-spacing="3px">WORKIES · PODCAST</mj-text>
      </mj-column>
    </mj-section>
    <mj-section padding="44px 36px 12px">
      <mj-column>
        <mj-text font-size="36px" font-weight="800" line-height="1.15">{{headline}}</mj-text>
        <mj-divider width="64px" align="right" padding="20px 0 18px" />
        <mj-text color="#bdb6ab" font-size="17px">{{subheadline}}</mj-text>
      </mj-column>
    </mj-section>
    <mj-section padding="24px 36px 0">
      <mj-column background-color="#1c2223" border-radius="6px" padding="24px">
        <mj-text font-weight="700" color="#D59C70" padding="0 0 6px">שלום {{first_name}},</mj-text>
        <mj-text>{{body}}</mj-text>
      </mj-column>
    </mj-section>
    <mj-section padding="28px 36px 44px">
      <mj-column>
        <mj-button href="{{cta_url}}">{{cta_label}}</mj-button>
      </mj-column>
    </mj-section>
    <mj-section background-color="#1c2223" padding="28px 36px">
      <mj-column>
        <mj-text font-size="18px" font-weight="800">אולפן הפודקאסט של Workies</mj-text>
        <mj-text color="#bdb6ab" font-size="14px" padding="6px 0 0">אליהו נאווי 24, באר שבע</mj-text>
      </mj-column>
    </mj-section>
    <mj-section background-color="#0e1112" padding="20px 36px 28px">
      <mj-column>
        <mj-text align="center" font-size="12px" color="#bdb6ab">דיוור פרסומי מאת Workies. <a href="{{unsubscribe_url}}" style="color:#bdb6ab;text-decoration:underline;">להסרה מרשימת התפוצה</a></mj-text>
      </mj-column>
    </mj-section>
  </mj-body>
</mjml>
